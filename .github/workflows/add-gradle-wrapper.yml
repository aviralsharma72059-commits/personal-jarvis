name: Add Gradle Wrapper

# Run once from the Actions tab. It generates gradlew, gradlew.bat and
# gradle-wrapper.jar and commits them to your repo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git diff --cached --quiet && echo "Wrapper already up to date" || (git commit -m "Add Gradle Wrapper 8.9" && git push)
