name: Build Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard - no API keys in source
        run: |
          if grep -rEn "sk-ant-[A-Za-z0-9_-]{20,}" --include="*.kt" --include="*.kts" --include="*.xml" --include="*.properties" --include="*.yml" . ; then
            echo "::error::An Anthropic API key was found in the source. Remove it and rotate the key."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle Wrapper if missing
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
